appId: "com.multiregionvpn"
---
# Complete Workflow Smoke Test

- launchApp
- waitForAnimationToEnd
- assertVisible:
    text: "Multi-Region VPN|Tunnels|Apps|Connections|Settings|Protected|Disconnected"

# Start VPN if not already connected
- runFlow:
    when:
      visible: "Disconnected"
    commands:
      - tapOn:
          point: "90%,8%"
      - waitForAnimationToEnd
      - assertVisible:
          text: "Protected|Connecting|Error"
          optional: true

# Stop VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected|Error"

