appId: "com.multiregionvpn"
---
# Complete Workflow Smoke Test

- launchApp
- waitForAnimationToEnd
- assertVisible: "Region Router"
- assertVisible: "App Routing Rules"

# Start VPN if not already connected
- runFlow:
    when:
      visible: "Disconnected"
    commands:
      - tapOn:
          point: "90%,8%"
      - waitForAnimationToEnd
      - assertVisible:
          text: "Protected"

# Stop VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected"
