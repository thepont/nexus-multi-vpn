appId: "com.multiregionvpn"
---
# Complete Workflow Smoke Test

- launchApp
- waitForAnimationToEnd
- assertVisible:
    text: ".*Region Router.*|.*Direct Internet.*"

# Start VPN if not already connected
- runFlow:
    when:
      visible: ".*Disconnected.*|.*Direct Internet.*"
    commands:
      - tapOn:
          point: "90%,8%"
      - waitForAnimationToEnd
      - assertVisible:
          text: ".*Protected.*|.*Connecting.*|.*Error.*"
          optional: true

# Stop VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd
- assertVisible:
    text: ".*Disconnected.*|.*Error.*|.*Direct Internet.*"
