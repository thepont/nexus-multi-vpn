appId: "com.multiregionvpn"
---
# Complete Workflow Smoke Test

- launchApp
- waitForAnimationToEnd
- assertVisible:
    text: "Region Router"
    optional: true

# Start VPN if not already connected
- runFlow:
    when:
      visible: "Disconnected"
    commands:
      - tapOn:
          point: "90%,8%"
      - waitForAnimationToEnd

# Stop VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected"
    optional: true
