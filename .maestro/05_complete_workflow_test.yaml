appId: "com.multiregionvpn"
---
# Complete Workflow Smoke Test

- launchApp
- waitForAnimationToEnd

- assertVisible:
    text: ".*Region Router.*|.*Direct Internet.*|.*App Routing Rules.*|.*Protected.*|.*Disconnected.*"

# Start VPN
- tapOn:
    id: "start_service_toggle"
    optional: true

- tapOn:
    point: "90%,8%"
    optional: true

- waitForAnimationToEnd

- assertVisible:
    text: ".*Protected.*|.*Connecting.*|.*Error.*|.*Disconnected.*"
    optional: true

# Stop VPN
- tapOn:
    id: "start_service_toggle"
    optional: true

- tapOn:
    point: "90%,8%"
    optional: true

- waitForAnimationToEnd

- assertVisible:
    text: ".*Disconnected.*|.*Error.*|.*Direct Internet.*"
    optional: true
