appId: "com.multiregionvpn"
---
# Complete Workflow Smoke Test

- launchApp
- waitForAnimationToEnd
- assertVisible:
    text: "Tunnels"
    optional: true

# Start VPN if not already connected
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "Protected|Connecting|Error"
    optional: true

# Stop VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected|Error|Direct Internet"
    optional: true
