appId: "com.multiregionvpn"
---
# Complete Workflow Smoke Test

- launchApp
- waitForAnimationToEnd
- assertVisible: "Region Router"

# Toggle VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd

# Handle system VPN permission dialog if it appears
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "Allow"
    optional: true

# Stop VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected"
    optional: true
