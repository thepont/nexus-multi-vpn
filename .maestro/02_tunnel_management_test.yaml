appId: "com.multiregionvpn"
---
# Tunnel Management Test
# Tests adding, viewing, and managing VPN tunnels

- launchApp

- waitForAnimationToEnd

# Test: Add a new tunnel (open Add dialog via button or region tile)
- tapOn:
    id: "add_vpn_config_button"
    optional: true
- tapOn:
    text: "UK"
    optional: true

# Fill in tunnel details
- tapOn:
    text: "Friendly Name"
    optional: true
- inputText:
    text: "Test UK Tunnel"
    optional: true
- tapOn:
    text: "Save"
    optional: true

- assertVisible:
    text: "Region Router"
    optional: true
