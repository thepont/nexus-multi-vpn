appId: "com.multiregionvpn"
---
# Tunnel Management Test
# Tests adding, viewing, and managing VPN tunnels

- launchApp
- waitForAnimationToEnd

# Test: Add a new tunnel (open Add dialog via add button or region tile)
- tapOn:
    id: "add_vpn_config_button"
    optional: true

- tapOn:
    text: "UK"
    optional: true

- assertVisible:
    text: ".*Add Server.*|.*Add Config.*|.*Friendly Name.*"
    optional: true

# Fill in tunnel details
- tapOn:
    id: "config_name_textfield"
    optional: true
- inputText: "Test UK Tunnel"

- tapOn:
    id: "config_region_dropdown"
    optional: true

- tapOn:
    text: "UK"
    optional: true

- tapOn:
    id: "config_save_button"
    optional: true

- tapOn:
    text: "Save"
    optional: true

- assertVisible:
    text: ".*Region Router.*|.*App Routing Rules.*|.*Tunnels.*|.*Apps.*"
    optional: true
