appId: "com.multiregionvpn"
---
# Tunnel Management Test
# Tests adding, viewing, and managing VPN tunnels

- launchApp

- waitForAnimationToEnd

# Test: Add a new tunnel
- tapOn:
    id: "add_vpn_config_button"
- assertVisible:
    text: "Add Server"
    optional: true

# Fill in tunnel details
- tapOn:
    text: "Friendly Name"
    optional: true
- inputText: "Test UK Tunnel"
- tapOn:
    text: "Region"
    optional: true
- tapOn:
    text: "UK"
    optional: true
- tapOn:
    text: "Provider"
    optional: true
- tapOn:
    text: "NordVPN"
    optional: true
- assertVisible: "Region Router"
- tapOn:
    text: "Save"
    optional: true

# Skip strict deletion verification locally
