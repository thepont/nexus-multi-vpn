appId: "com.multiregionvpn"
---
# Tunnel Management Test
# Tests adding, viewing, and managing VPN tunnels

- launchApp

- waitForAnimationToEnd

# Test: Add a new tunnel (open Add dialog via region tile)
- tapOn:
    text: "UK"
    optional: true
- assertVisible:
    text: "Add Server"
    optional: true

# Fill in tunnel details
- tapOn:
    text: "Friendly Name"
    optional: true
- inputText: "Test UK Server"
- tapOn:
    text: "Hostname"
    optional: true
- inputText: "uk1234.nordvpn.com"

# Select region/type options
- tapOn:
    text: ".*Provider.*|.*Template.*"
    optional: true
- tapOn:
    text: ".*NordVPN.*|.*local-test.*"
    optional: true
- tapOn:
    text: ".*Fetch Server.*|.*Auto-Fetch.*|.*Auto Fetch.*"
    optional: true
- assertVisible:
    text: "Region Router"
    optional: true

# Clean up / close dialog if still open
- tapOn:
    text: "Cancel"
    optional: true

# Skip strict deletion verification locally
