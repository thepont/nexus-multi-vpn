appId: "com.multiregionvpn"
---
# VPN Toggle Test
# Tests the VPN on/off toggle and status updates

- launchApp

# Verify initial state
- assertVisible:
    text: "Region Router"
    optional: true

# Toggle ON
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd

# Handle VPN permission dialog (if appears)
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "ALLOW"
    optional: true

# Wait for status to change
- waitForAnimationToEnd

# Test: Toggle VPN OFF
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd

# Clean up toggle
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected"
    optional: true
