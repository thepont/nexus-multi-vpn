appId: "com.multiregionvpn"
---
# VPN Toggle Test
# Tests the VPN on/off toggle and status updates

- launchApp

# Verify initial state
- assertVisible:
    text: "Region Router"
    optional: true

# If not connected, turn ON
- runFlow:
    when:
      visible: "Disconnected"
    commands:
      - tapOn:
          point: "90%,8%"
      - waitForAnimationToEnd

# Handle VPN permission dialog (if appears)
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "ALLOW"
    optional: true

- waitForAnimationToEnd

# Toggle VPN OFF
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd

- assertVisible:
    text: "Disconnected"
    optional: true
