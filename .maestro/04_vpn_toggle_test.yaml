appId: "com.multiregionvpn"
---
# VPN Toggle Test
# Tests the VPN on/off toggle and status updates

- launchApp

# Verify initial state
- assertVisible:
    text: "Tunnels"
    optional: true

# Toggle ON
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd

# Handle VPN permission dialog (if appears)
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "ALLOW"
    optional: true

- waitForAnimationToEnd

# Toggle OFF
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected|Error"
    optional: true
