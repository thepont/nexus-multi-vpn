appId: "com.multiregionvpn"
---
# VPN Toggle Test
# Tests the VPN on/off toggle and status updates

- launchApp
- waitForAnimationToEnd

# Verify initial state
- assertVisible:
    text: ".*Direct Internet.*|.*Region Router.*|.*App Routing Rules.*|.*Protected.*|.*Disconnected.*"

# Toggle VPN
- tapOn:
    id: "start_service_toggle"
    optional: true

- tapOn:
    point: "90%,8%"
    optional: true

- waitForAnimationToEnd

# Handle VPN permission dialog (if appears)
- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Allow"
    optional: true

- waitForAnimationToEnd

# Toggle VPN OFF
- tapOn:
    id: "start_service_toggle"
    optional: true

- tapOn:
    point: "90%,8%"
    optional: true

- waitForAnimationToEnd

- assertVisible:
    text: ".*Disconnected.*|.*Error.*|.*Direct Internet.*"
    optional: true
