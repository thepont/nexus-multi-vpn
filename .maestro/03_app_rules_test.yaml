appId: "com.multiregionvpn"
---
# App Rules Test
# Tests assigning apps to tunnels and routing configuration

- launchApp
- tapOn: "Apps"
- waitForAnimationToEnd

# Test: Assign an app to a tunnel
- scroll
- tapOn:
    text: "Chrome"
    optional: true

# Select a tunnel
- tapOn: "UK"
  optional: true

# Verify rule was saved
- assertVisible: "Chrome"

# Test: Remove app rule
- tapOn: "Chrome"
  optional: true
- tapOn: "Direct Internet"
  optional: true

- waitForAnimationToEnd
