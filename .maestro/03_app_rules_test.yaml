appId: "com.multiregionvpn"
---
# App Rules Test
# Tests assigning apps to tunnels and routing configuration

- launchApp
- tapOn: "Apps"
- waitForAnimationToEnd

# Test: Assign an app to a tunnel
- scroll
- tapOn:
    text: "Chrome"
    optional: true

# Select a tunnel (UK variants)
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true

# Scroll through app list
- scroll
- waitForAnimationToEnd

# Test: Filter/search apps (if search bar present)
- tapOn:
    text: "Search"
    optional: true
- inputText: "France"
- waitForAnimationToEnd

# Clear search
- tapOn:
    text: "Clear"
    optional: true

# Assign France app if present
- tapOn:
    text: "France"
    optional: true
- tapOn:
    text: ".*France.*|.*FR.*"
    optional: true

# Reset filter
- swipe:
    start: "50%,20%"
    end: "50%,80%"
    duration: 300

# UK apps may or may not be present in this build; skip ordering checks
