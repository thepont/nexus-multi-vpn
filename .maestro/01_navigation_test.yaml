appId: "com.multiregionvpn"
---
# UI Navigation Test
# Validates region list is visible

- launchApp

# Basic UI presence checks
- assertVisible:
    text: "Region Router"

# Navigate to Apps tab
- tapOn: "Apps"
- waitForAnimationToEnd
- assertVisible:
    text: "App Routing Rules"

# Navigate to Settings tab
- tapOn: "Settings"
- waitForAnimationToEnd
- assertVisible:
    text: "Direct Internet"

