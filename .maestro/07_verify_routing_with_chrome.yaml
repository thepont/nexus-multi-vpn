appId: "com.multiregionvpn"
---
# Verify Routing with Chrome
# Tests that Chrome actually routes through the VPN tunnel

- launchApp

# Assign Chrome to UK tunnel
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd

# Launch Chrome if present
- runFlow:
    when:
      visible: "Chrome"
    commands:
      - launchApp:
          appId: "com.android.chrome"
          clearState: false
          optional: true
      - tapOn:
          id: "url_bar"
          optional: true
      - inputText: "https://free.freeipapi.com/api/json"
      - pressKey: Enter
      - assertVisible:
          text: ".*GB.*|.*United Kingdom.*"
          optional: true

# Return to VPN app
- stopApp:
    optional: true
- launchApp:
    appId: "com.multiregionvpn"
    optional: true

# Turn off VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected|Error|Direct Internet"
    optional: true
