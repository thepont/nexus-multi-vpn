appId: "com.multiregionvpn"
---
# Verify Routing with Chrome
# Tests that Chrome actually routes through the VPN tunnel

- launchApp

# Assign Chrome to UK tunnel
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd

# Should show Protected (allow transient states)
- assertVisible:
    text: ".*Protected.*|.*Connecting.*|.*Error.*"
    optional: true

# Launch Chrome optionally
- runFlow:
    optional: true
    commands:
      - stopApp
      - launchApp:
          appId: "com.android.chrome"
          clearState: false
      - tapOn:
          id: "url_bar"
          optional: true
      - inputText: "https://free.freeipapi.com/api/json"
      - pressKey: Enter
      - assertVisible:
          text: ".*countryName.*|.*cityName.*|.*GB.*|.*United Kingdom.*"
          optional: true

# Return to VPN app
- stopApp
- launchApp:
    appId: "com.multiregionvpn"

# Turn off VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd
- assertVisible:
    text: ".*Disconnected.*|.*Error.*|.*Direct Internet.*"
