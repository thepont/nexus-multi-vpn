appId: "com.multiregionvpn"
---
# Verify Routing with Chrome
# Tests that Chrome actually routes through the VPN tunnel
# This is a REAL end-to-end test with a production browser

- launchApp

# Assign Chrome to UK tunnel
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: ".*UK.*"
    optional: true
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd

# Should show Protected (allow transient states)
- assertVisible:
    text: "Region Router"
    optional: true

# Launch Chrome if available
- runFlow:
    when:
      visible: "Chrome"
    commands:
      - launchApp:
          appId: "com.android.chrome"
          clearState: false
      - tapOn:
          id: "url_bar"
          optional: true
      - inputText: "https://free.freeipapi.com/api/json"
      - pressKey: Enter
      - assertVisible:
          text: ".*countryName.*|.*countryCode.*"
          optional: true

# Return to VPN app
- stopApp:
    appId: "com.android.chrome"
    optional: true
- launchApp:
    appId: "com.multiregionvpn"

# Turn off VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd
- assertVisible:
    text: "Region Router"
    optional: true
