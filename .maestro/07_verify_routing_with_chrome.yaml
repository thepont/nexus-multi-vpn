appId: "com.multiregionvpn"
---
# Verify Routing with Chrome
# Tests that Chrome actually routes through the VPN tunnel
# This is a REAL end-to-end test with a production browser

- launchApp

# Assign Chrome to UK tunnel
- tapOn:
    text: "Apps"
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: ".*UK.*"
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd

# Should show Protected (allow transient states)
- runFlow:
    when:
      visible: "Protected"
    commands:
      - assertVisible: "Protected"

# Launch Chrome
- stopApp
- runFlow:
    appId: "com.android.chrome"
    optional: true
    commands:
      - launchApp:
          appId: "com.android.chrome"
          clearState: false

      # Navigate to IP check site
      - tapOn:
          id: "url_bar"
          optional: true
      - inputText: "https://free.freeipapi.com/api/json"
      - pressKey: Enter

      # Wait for page to load
      - assertVisible: "GB"

# Return to VPN app
- stopApp
- launchApp:
    appId: "com.multiregionvpn"

# Turn off VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd
- assertVisible: "Disconnected"
