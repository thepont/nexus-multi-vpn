appId: "com.multiregionvpn"
---
# Verify Routing with Chrome
# Tests that Chrome actually routes through the VPN tunnel

- launchApp

# Assign Chrome to UK tunnel
- tapOn:
    text: "Chrome"
    optional: true
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd

# Launch Chrome optionally (if Chrome is present on emulator)
- runFlow:
    when:
      visible: "Chrome"
    commands:
      - launchApp:
          appId: "com.android.chrome"
          clearState: false
          optional: true
      - tapOn:
          id: "url_bar"
          optional: true
      - inputText: "https://free.freeipapi.com/api/json"
      - pressKey: Enter
      - assertVisible:
          text: "countryName"
          optional: true

# Return to VPN app
- launchApp:
    appId: "com.multiregionvpn"

# Turn off VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd
