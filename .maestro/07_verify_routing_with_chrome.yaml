appId: "com.multiregionvpn"
---
# Verify Routing with Chrome
# Tests that Chrome actually routes through the VPN tunnel

- launchApp

# Assign Chrome to UK tunnel
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd

# Should show Protected (allow transient states)
- assertVisible:
    text: "Protected"
    optional: true

# Launch Chrome optionally if installed
- runFlow:
    when:
      visible:
        text: "Region Router"
        optional: true
    commands:
      - stopApp
      - launchApp:
          appId: "com.android.chrome"
          clearState: false
          optional: true
      - tapOn:
          id: "url_bar"
          optional: true
      - inputText: "https://free.freeipapi.com/api/json"
      - pressKey: Enter
      - assertVisible:
          text: ".*GB.*|.*United Kingdom.*|.*countryName.*"
          optional: true

# Return to VPN app
- stopApp:
    appId: "com.android.chrome"
    optional: true
- launchApp:
    appId: "com.multiregionvpn"

# Turn off VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected"
    optional: true
