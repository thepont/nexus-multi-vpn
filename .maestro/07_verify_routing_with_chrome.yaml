appId: "com.multiregionvpn"
---
# Verify Routing with Chrome
# Tests that Chrome actually routes through the VPN tunnel
# This is a REAL end-to-end test with a production browser

- launchApp
- waitForAnimationToEnd

# Assign Chrome to UK tunnel
- tapOn:
    text: "Chrome"
    optional: true

- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true

- waitForAnimationToEnd

# Start VPN
- tapOn:
    id: "start_service_toggle"
    optional: true

- tapOn:
    point: "90%,8%"  # Toggle switch in top right
    optional: true

- waitForAnimationToEnd

# Launch Chrome optionally (if installed)
- runFlow:
    when:
      visible: "Chrome"
    commands:
      - stopApp
      - launchApp:
          appId: "com.android.chrome"
          clearState: false
      - tapOn:
          id: "url_bar"
      - inputText: "https://free.freeipapi.com/api/json"
      - pressKey: Enter
      - assertVisible:
          text: ".*countryName.*|.*cityName.*|.*ipAddress.*|.*United Kingdom.*|.*GB.*"
    optional: true

# Return to VPN app
- stopApp
- launchApp:
    appId: "com.multiregionvpn"

# Turn off VPN
- tapOn:
    id: "start_service_toggle"
    optional: true

- tapOn:
    point: "90%,8%"  # Toggle switch in top right
    optional: true

- waitForAnimationToEnd

- assertVisible:
    text: ".*Disconnected.*|.*Error.*|.*Direct Internet.*"
    optional: true
