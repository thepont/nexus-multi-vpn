appId: "com.multiregionvpn"
---
# Verify Routing with Chrome
# Tests that Chrome actually routes through the VPN tunnel
# This is a REAL end-to-end test with a production browser

- launchApp

# Assign Chrome to UK tunnel
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd

# Should show Protected (allow transient states)
- assertVisible:
    text: "Protected|Connecting|Error"
    optional: true

# Launch Chrome
- runFlow:
    when:
      visible: "Chrome"
    commands:
      - stopApp
      - launchApp:
          appId: "com.android.chrome"
          clearState: false
          optional: true

      # Navigate to IP check site
      - tapOn:
          id: "url_bar"
          optional: true
      - inputText: "https://free.freeipapi.com/api/json"
      - pressKey: Enter

      # Wait for page to load (use a simple assertion with optional)
      - assertVisible:
          text: ".*freeipapi.*|United Kingdom|GB|countryName|cityName"
          optional: true

      # Look for "GB" in the page content (UK country code)
      - assertVisible:
          text: '"GB"|United Kingdom|countryName'
          optional: true

# Return to VPN app
- stopApp
- launchApp:
    appId: "com.multiregionvpn"

# Turn off VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected|Error|Direct Internet"
    optional: true
