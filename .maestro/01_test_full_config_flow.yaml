appId: "com.multiregionvpn"
---
- launchApp

- waitForAnimationToEnd

# --- 1. (Optional) Return to Tunnels ---
- tapOn:
    text: "Tunnels"
    optional: true

# --- 2. Ensure a UK VPN Server Config exists ---
- assertVisible:
    text: '.*UK.*\(OpenVPN\)|Test .*UK.* Server'
    optional: true
- runFlow:
    when:
      notVisible: '.*UK.*\(OpenVPN\)|Test .*UK.* Server'
    commands:
      - tapOn:
          id: "add_vpn_config_button"
          optional: true
      - tapOn:
          text: "UK"
          optional: true
      - assertVisible:
          text: "Add Server"
          optional: true
      - tapOn:
          text: "Friendly Name"
          optional: true
      - inputText: "Test UK Server"
      - tapOn:
          text: "Region"
          optional: true
      - tapOn:
          text: "UK"
          optional: true
      - tapOn:
          text: "Save"
          optional: true

# --- 3. Assign a Rule to an App ---
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: 'Test UK Server|.*UK.*\(OpenVPN\)'
    optional: true

# --- 4. Start the VPN Service ---
- tapOn:
    point: "90%,8%"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
