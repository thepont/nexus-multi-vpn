appId: "com.multiregionvpn"
---
- launchApp

- waitForAnimationToEnd
## Ensure list is in a stable position
- swipe:
    start: "50%,20%"
    end: "50%,80%"
    duration: 200
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 200

# --- 1. (Optional) If navigated to Settings, return to Tunnels ---
- tapOn:
    text: "Tunnels"
    optional: true

# --- 2. Ensure a UK VPN Server Config exists (create if missing) ---
- tapOn:
    id: "add_vpn_config_button"
    optional: true
- tapOn:
    text: "UK"
    optional: true
- tapOn:
    text: "Friendly Name"
    optional: true
- inputText: "Test UK Server"
- tapOn:
    text: "Save"
    optional: true

# --- 3. Assign a Rule to an App ---
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*'
    optional: true

# --- 4. Start the VPN Service ---
- tapOn:
    point: "90%,8%"
    optional: true
# Handle system VPN permission dialog if it appears
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
