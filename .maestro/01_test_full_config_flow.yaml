appId: "com.multiregionvpn"
---
- launchApp
- waitForAnimationToEnd

# --- 1. Navigate to Settings / Tunnels if tabs exist ---
- tapOn:
    text: "Settings"
    optional: true

- tapOn:
    text: "Tunnels"
    optional: true

# --- 2. Add VPN Config on clean database run ---
- tapOn:
    id: "add_vpn_config_button"
    optional: true

- tapOn:
    text: "Add Config"
    optional: true

- tapOn:
    text: "Add Server"
    optional: true

- tapOn:
    text: "UK"
    optional: true

- tapOn:
    id: "config_name_textfield"
    optional: true
- inputText: "Test UK Server"

- tapOn:
    id: "config_save_button"
    optional: true

- tapOn:
    text: "Save"
    optional: true

# --- 3. Assign Rule in Apps tab ---
- tapOn:
    text: "Apps"
    optional: true

- scroll
- tapOn:
    text: "Chrome"
    optional: true

# --- 4. Toggle VPN Service ---
- tapOn:
    id: "start_service_toggle"
    optional: true

- tapOn:
    point: "90%,8%"
    optional: true

- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Allow"
    optional: true
