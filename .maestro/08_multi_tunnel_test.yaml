appId: "com.multiregionvpn"
---
# Multi-Tunnel Test
# Tests multiple tunnels running simultaneously with different apps

- launchApp
- tapOn: "Apps"
- waitForAnimationToEnd

# Prerequisites: Assume tunnels exist (skip strict checks)

# ============================================
# STEP 1: Assign multiple apps to different tunnels
# ============================================

# Assign Chrome to UK
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Scroll to find next app
- scroll
- waitForAnimationToEnd

# Assign Netflix to France
- tapOn:
    text: "Netflix"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

# Assign YouTube to UK
- tapOn:
    text: "YouTube"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# ============================================
# STEP 2: Start VPN (will connect all active tunnels)
# ============================================
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd

# Handle permission dialogs
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "ALLOW"
    optional: true

# Should show active connection count or status
- assertVisible:
    text: ".*Protected.*|.*Connecting.*|.*2 Tunnels Active.*|.*Error.*"
    optional: true

# ============================================
# STEP 3: Change routing dynamically while connected
# ============================================

# Change YouTube from UK to France
- tapOn:
    text: "YouTube"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

# VPN should stay up (skip strict assertion)

# Change Netflix from France to UK
- tapOn:
    text: "Netflix"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

- waitForAnimationToEnd

# ============================================
# STEP 4: Stop VPN (disconnects all tunnels)
# ============================================
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd
- assertVisible: "Disconnected"

# Both tunnels should show Disconnected
# Skip strict disconnected status per tunnel
