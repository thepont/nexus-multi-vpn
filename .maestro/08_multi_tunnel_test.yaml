appId: "com.multiregionvpn"
---
# Multi-Tunnel Test
# Tests multiple tunnels running simultaneously with different apps

- launchApp

# STEP 1: Assign multiple apps to different tunnels
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

- scroll
- scroll

- tapOn:
    text: "Firefox"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

- scroll
- scroll

- tapOn:
    text: "Netflix|Disney"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# STEP 2: Start VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd

# STEP 4: Test rapid switching
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# STEP 5: Remove app rules
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: "Direct Internet"
    optional: true
- waitForAnimationToEnd

# STEP 6: Stop VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected"
    optional: true
