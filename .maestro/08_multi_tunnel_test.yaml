appId: "com.multiregionvpn"
---
# Multi-Tunnel Test
# Tests multiple tunnels running simultaneously with different apps

- launchApp

# STEP 1: Assign multiple apps to different tunnels
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

- scroll
- scroll

# Assign Firefox to France (if exists)
- tapOn:
    text: "Firefox"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

- scroll
- scroll

# Assign a streaming app to UK
- tapOn:
    text: "Netflix|Disney"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# STEP 2: Start VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd

# STEP 3: Test rapid switching
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

# Switch back to UK
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# STEP 4: Remove app rules
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: "Direct Internet"
    optional: true
- waitForAnimationToEnd

# STEP 5: Stop VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: ".*Disconnected.*|.*Error.*|.*Direct Internet.*"
    optional: true
