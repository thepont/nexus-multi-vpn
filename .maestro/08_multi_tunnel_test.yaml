appId: "com.multiregionvpn"
---
# Multi-Tunnel Test
# Tests multiple tunnels running simultaneously with different apps

- launchApp

# Assign Chrome to UK
- tapOn:
    text: "Chrome"
    optional: true
- waitForAnimationToEnd

# Scroll to find another app
- scroll:
    optional: true

# Assign Firefox if exists
- tapOn:
    text: "Firefox"
    optional: true
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd

# Remove app rules
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: "Direct Internet"
    optional: true
- waitForAnimationToEnd

# Stop VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd
