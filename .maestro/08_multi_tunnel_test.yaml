appId: "com.multiregionvpn"
---
# Multi-Tunnel Test
# Tests multiple tunnels running simultaneously with different apps

- launchApp

# Assign Chrome to UK
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Scroll to find another app
- scroll
- scroll

# Assign Firefox to France (if exists)
- tapOn:
    text: "Firefox"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

# Scroll to find third app
- scroll
- scroll

# Assign a streaming app to UK
- tapOn:
    text: "Netflix|Disney"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd

# Test rapid switching
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

# Switch back to UK
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Remove app rules
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: "Direct Internet"
    optional: true
- waitForAnimationToEnd

# Stop VPN
- tapOn:
    point: "90%,8%"  # Toggle switch in top right
- waitForAnimationToEnd
- assertVisible:
    text: ".*Disconnected.*|.*Error.*|.*Direct Internet.*"
    optional: true
