appId: "com.multiregionvpn"
---
# Multi-Tunnel Test
# Validates switching between different VPN tunnels

- launchApp

# Ensure we have UK and France configs (simplified)
- tapOn: "UK"
  optional: true
- tapOn: "Save"
  optional: true

- tapOn: "France"
  optional: true
- tapOn: "Save"
  optional: true

# Switch to UK
- tapOn: "UK"
- waitForAnimationToEnd

# Switch to France
- tapOn: "France"
- waitForAnimationToEnd

# Toggle VPN
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd

# Toggle OFF
- tapOn:
    point: "90%,8%"
- waitForAnimationToEnd
- assertVisible: "Disconnected"
