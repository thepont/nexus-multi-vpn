appId: "com.multiregionvpn"
---
# Multi-Tunnel Test
# Tests multiple tunnels running simultaneously with different apps

- launchApp

# Assign Chrome to UK
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Assign Firefox to France (if exists)
- tapOn:
    text: "Firefox"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

# Assign streaming app
- tapOn:
    text: "Netflix|Disney"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Start VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd

# Switch Chrome rule
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*France.*\(OpenVPN\)|.*France.*|.*FR.*'
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: '.*UK.*\(OpenVPN\)|.*UK.*|.*BBC.*'
    optional: true
- waitForAnimationToEnd

# Remove app rule
- tapOn:
    text: "Chrome"
    optional: true
- tapOn:
    text: "Direct Internet"
    optional: true
- waitForAnimationToEnd

# Stop VPN
- tapOn:
    point: "90%,8%"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "Disconnected|Error|Direct Internet"
    optional: true
